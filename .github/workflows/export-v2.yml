name: Export static V2

on:
  push:
    branches:
      - agent/modern-ui-locking-systems

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh generated v2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ui-locking-systems

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/rotosim-server.log 2>&1 &
          echo $! > /tmp/rotosim-server.pid

      - name: Export static simulator
        run: node scripts/export-v2.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulator-v2.html src/generated/simulator.css src/generated/simulator-runtime.js
          if git diff --cached --quiet; then
            echo "Generated V2 is current."
          else
            git commit -m "chore: refresh generated v2"
            git push origin HEAD:agent/modern-ui-locking-systems
          fi
